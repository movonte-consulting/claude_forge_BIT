# =============================================================================
# Forge manifest reference — known-good annotated example
# =============================================================================
# This is the structural template for a modern UI Kit (React-based) Confluence
# macro. Use it as the shape to match, not as code to copy verbatim.
#
# Top-level keys: modules, resources, permissions, app
# YAML is whitespace-sensitive — 2-space indentation, no tabs.
# =============================================================================

modules:
  # macro module = the type of UI we're providing (a Confluence macro)
  macro:
    - key: example-macro                    # unique key for this macro
      resource: main                        # → references resources[].key below
      render: native                        # REQUIRED for UI Kit — omitting this makes
                                             # the CLI treat the resource as Custom UI
                                             # (which then demands a directory, not a file)
      resolver:
        function: example-resolver          # → references function[].key below
      title: Example Macro
      description: A short user-facing description.
      # Optional config UI for macro parameters:
      # config:
      #   resource: config-ui
      #   resolver:
      #     function: config-resolver

  # function module = backend code that handles resolver calls
  function:
    - key: example-resolver                 # referenced by macro.resolver.function above
      handler: index.handler                # → src/index.js must `export const handler = ...`

resources:
  # Each entry maps a key (used in modules) to a frontend bundle path
  - key: main
    path: src/frontend/index.jsx            # entry point; ForgeReconciler.render() lives here

permissions:
  # Scopes are RUNTIME-enforced. Missing scopes → 401 at call time, not at deploy.
  scopes:
    - read:page:confluence                  # read v2 pages API
    - read:attachment:confluence            # read page attachments
    - read:confluence-user                  # look up users by accountId (v1 /wiki/rest/api/user)
                                             # NOT "read:user:confluence" — that's the wrong scope name

app:
  runtime:
    name: nodejs22.x                        # always nodejs22.x for new apps
  id: ari:cloud:ecosystem::app/REPLACE-WITH-YOUR-APP-ID
  # ^ Generated by `forge register` on first setup. Never hand-edit.

# =============================================================================
# Cross-references in this file (read top to bottom):
#
#   macro[0].resource           "main"                → resources[0].key
#   macro[0].render             "native"              → REQUIRED for UI Kit; omitting it
#                                                        makes lint treat the resource as
#                                                        Custom UI (directory required)
#   macro[0].resolver.function  "example-resolver"    → function[0].key
#   function[0].handler         "index.handler"       → src/index.js exports `handler`
#   resources[0].path           "src/frontend/..."    → file must actually exist
#
# If a `forge deploy` fails with "key not found" or "module not found", trace
# one of these four references — one of them is broken.
# =============================================================================
